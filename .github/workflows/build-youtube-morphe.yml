name: Build YouTube Morphe

# Daily check for new Morphe Desktop / Morphe Patches releases.
# Builds and publishes a patched YouTube APK (arm64-v8a, non-root)
# as a GitHub Release only when a new combination has not been built yet.
on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC = 00:00 IST daily
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-youtube-morphe.yml"
      - "scripts/**"
      - "keystore/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this combination was already released"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-youtube-morphe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Build patched YouTube (if Morphe updated)
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: bash scripts/build.sh
